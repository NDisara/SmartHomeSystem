<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Hardware Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #f0f0f0;
            padding: 20px;
        }
        h1 {
            color: #64b5f6;
        }
        .device-card {
            background: #2c2c2c;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 6px solid #888;
            transition: 0.3s;
        }
        .device-card.on {
            border-left-color: #4caf50;
            background: #24331f;
        }
        .device-card.off {
            border-left-color: #757575;
        }
        .device-name {
            font-size: 18px;
            font-weight: bold;
        }
        .device-state {
            font-size: 14px;
            margin-top: 4px;
            color: #ccc;
        }
        .switch-row {
            margin-top: 8px;
            padding: 6px 10px;
            background: #3a3a3a;
            border-radius: 6px;
            display: inline-block;
            margin-right: 8px;
        }
        #status {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 6px;
            background: #333;
        }
    </style>
</head>

<body>

<h1>🏠 Smart Home Hardware Simulator</h1>
<div id="status">Connecting to Firebase...</div>
<div id="devices"></div>

<!-- Firebase SDK (CDN) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCY0NJZ7Z2Bh6eRVvk4OhCMpa-rdbeQ1Gw",
        authDomain: "smarthomesystem-70abf.firebaseapp.com",
        databaseURL: "https://smarthomesystem-70abf-default-rtdb.firebaseio.com",
        projectId: "smarthomesystem-70abf",
        storageBucket: "smarthomesystem-70abf.firebasestorage.app",
        messagingSenderId: "870635457059",
        appId: "1:870635457059:web:45e3a3c2dcfd754e577f96"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusDiv = document.getElementById("status");
    const devicesDiv = document.getElementById("devices");

    // Listen to ALL floors and their devices
    const floorsRef = ref(db, "floors");

    onValue(floorsRef, (snapshot) => {
        statusDiv.textContent = "✅ Connected — Live data from Firebase";
        devicesDiv.innerHTML = "";

        const floorsData = snapshot.val();
        if (!floorsData) {
            devicesDiv.innerHTML = "<p>No floor data found.</p>";
            return;
        }

        Object.keys(floorsData).forEach((floorId) => {
            const floor = floorsData[floorId];
            const devices = floor.devices || {};

            const floorHeader = document.createElement("h2");
            floorHeader.textContent = "Floor: " + floorId;
            devicesDiv.appendChild(floorHeader);

            Object.keys(devices).forEach((deviceId) => {
                const device = devices[deviceId];
                const card = document.createElement("div");
                const isOn = device.state === "ON";
                card.className = "device-card " + (isOn ? "on" : "off");

                let innerHTML = `<div class="device-name">${device.name || deviceId} (${device.type || "unknown"})</div>`;

                if (device.type === "multiswitch" && device.switches) {
                    innerHTML += `<div class="device-state">Switches:</div>`;
                    Object.keys(device.switches).forEach((swId) => {
                        const swState = device.switches[swId];
                        innerHTML += `<span class="switch-row">${swId}: ${swState}</span>`;
                    });
                } else if (device.type === "camera") {
                    innerHTML += `<div class="device-state">📷 Streaming (mock): ${device.streamUrl || "N/A"}</div>`;
                } else {
                    innerHTML += `<div class="device-state">State: ${device.state || "OFF"}</div>`;
                    if (device.type === "iron" && device.maxDurationSec) {
                        innerHTML += `<div class="device-state">Max duration: ${device.maxDurationSec / 60} min</div>`;
                    }
                }

                card.innerHTML = innerHTML;
                devicesDiv.appendChild(card);
            });
        });
    }, (error) => {
        statusDiv.textContent = "❌ Connection error: " + error.message;
    });
</script>
</body>
</html>

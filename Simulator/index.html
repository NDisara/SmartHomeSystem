<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Hardware Simulator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #f0f0f0; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #2196F3; font-weight: 300; }
        .floor-section { margin-top: 40px; border-top: 1px solid #333; padding-top: 20px; }
        .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; border: 1px solid #333; transition: 0.3s; }
        .card.on { border-color: #4caf50; background: #1b261b; }
        .card.error { border-color: #f44336; }
        .name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .type { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 15px; }
        .status { font-size: 14px; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .status.on { background: #4caf50; color: white; }
        .status.off { background: #424242; color: #aaa; }
        .switch-unit { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .sw-row { display: flex; justify-content: space-between; background: #2a2a2a; padding: 8px; border-radius: 6px; font-size: 13px; }
        #status-bar { background: #1a1a1a; padding: 10px 20px; border-radius: 8px; margin-bottom: 30px; font-size: 14px; }
        .camera-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; margin-top: 10px; display: flex; align-items: center; justify-content: center; color: #555; }
    </style>
</head>

<body>

<div class="container">
    <h1>🏠 IoT Hardware Simulator</h1>
    <div id="status-bar">Initializing connection...</div>
    <div id="floors-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCY0NJZ7Z2Bh6eRVvk4OhCMpa-rdbeQ1Gw",
        authDomain: "smarthomesystem-70abf.firebaseapp.com",
        databaseURL: "https://smarthomesystem-70abf-default-rtdb.firebaseio.com",
        projectId: "smarthomesystem-70abf",
        storageBucket: "smarthomesystem-70abf.firebasestorage.app",
        messagingSenderId: "870635457059",
        appId: "1:870635457059:web:45e3a3c2dcfd754e577f96"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const container = document.getElementById("floors-container");
    const statusBar = document.getElementById("status-bar");

    onValue(ref(db, "floors"), (snapshot) => {
        statusBar.innerHTML = "🟢 Connected - Monitoring " + (snapshot.exists() ? Object.keys(snapshot.val()).length : 0) + " floors";
        container.innerHTML = "";

        const data = snapshot.val();
        if (!data) return;

        Object.entries(data).forEach(([floorId, floor]) => {
            const section = document.createElement("div");
            section.className = "floor-section";
            section.innerHTML = `<h2>Floor: ${floor.name || floorId}</h2>`;

            const grid = document.createElement("div");
            grid.className = "device-grid";

            if (floor.devices) {
                Object.entries(floor.devices).forEach(([deviceId, device]) => {
                    const card = document.createElement("div");
                    const isOn = device.state === "ON";
                    card.className = `card ${isOn ? 'on' : ''} ${device.state === 'ERROR' ? 'error' : ''}`;

                    let content = `<div class="name">${device.name}</div><div class="type">${device.type}</div>`;

                    if (device.type === "multiswitch" && device.switches) {
                        content += `<div class="switch-unit">`;
                        Object.entries(device.switches).forEach(([swId, swState]) => {
                            content += `<div class="sw-row"><span>${swId.split('_')[1] || swId}</span> <b>${swState}</b></div>`;
                        });
                        content += `</div>`;
                    } else if (device.type === "camera") {
                        content += `<div class="camera-box">LIVE STREAMING</div>`;
                    } else {
                        content += `<span class="status ${isOn ? 'on' : 'off'}">${device.state}</span>`;
                        if (device.type === "iron" && isOn) {
                            content += `<div style="font-size:11px; margin-top:10px; color:#ff9800;">Safety cutoff active</div>`;
                        }
                        if (device.type === "light" && device.scheduleOn) {
                            content += `<div style="font-size:11px; margin-top:10px; color:#2196f3;">Schedule: ${device.scheduleOn} - ${device.scheduleOff}</div>`;
                        }
                    }

                    card.innerHTML = content;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = "<p style='color:#666'>No devices found.</p>";
            }

            section.appendChild(grid);
            container.appendChild(section);
        });
    });
</script>
</body>
</html>
